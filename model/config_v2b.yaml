# arranger-v2b (BLOCK4.md Step 3 variant): arranger-v2 WITHOUT the source-part feature, class weights only.
# With the feature the part head becomes a lookup (the target part is a fixed function of the source
# part), so v2 reproduces the plain merged reduction; v2b keeps v1's pitch-only input.
# Realisation CE class weights: sqrt(f_plain / f_class) capped at 10 (label_stats.json), NOT on double.
run_name: arranger-v2b
seed: 0
net: {d: 256, layers: 6, heads: 8, ff: 1024, dropout: 0.1, src_feature: false}
real_class_weights: [1.0, 10.0, 10.0, 7.0, 1.0]   # plain, tremolo, repeat, arpeggiate, double
steps: 30000
phase1_steps: 9000      # supervised recovery: only context notes revealed
ramp_steps: 6000        # then reveal_max ramps linearly to its final value
reveal_max: 0.9
batch: 32
lr: 3.0e-4
weight_decay: 0.01
warmup: 1000
workers: 10
log_every: 50
val_every: 1000
val_batches: 20
