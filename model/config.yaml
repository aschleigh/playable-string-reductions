# Arranger training run (MODEL.md). Losses: CE(part) + CE(octave) + CE(realisation), equal weights.
run_name: arranger-v1
seed: 0
net: {d: 256, layers: 6, heads: 8, ff: 1024, dropout: 0.1}
steps: 30000
phase1_steps: 9000      # supervised recovery: only context notes revealed
ramp_steps: 6000        # then reveal_max ramps linearly to its final value
reveal_max: 0.9
batch: 32
lr: 3.0e-4
weight_decay: 0.01
warmup: 1000
workers: 10
log_every: 50
val_every: 1000
val_batches: 20
